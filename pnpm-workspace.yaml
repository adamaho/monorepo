packages:
  - programs/*
  - packages/*
  - tools/*
  - infra/*

allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true

catalog:
  "@adamaho/nopeus-oxfmt-config": 0.1.0
  "@adamaho/nopeus-oxlint-config": 0.5.0
  "@adamaho/nopeus-oxlint-plugin": 0.10.1
  "@adamaho/nopeus-tsconfig": 0.3.2
  "@changesets/cli": 3.0.3
  "@effect/tsgo": 0.53.0
  "@effect/vitest": 4.0.5
  "@types/node": 24.19.2
  effect: 4.0.5
  oxfmt: 0.71.0
  oxlint: 1.88.0
  rimraf: 6.1.3
  turbo: 2.11.8
  typescript: 7.0.2
  vitest: 5.0.4

catalogMode: strict

saveExact: true
engineStrict: true

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - "@adamaho/*"
