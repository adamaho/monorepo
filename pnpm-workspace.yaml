packages:
  - programs/*
  - packages/*
  - tools/*
  - infra/*

allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true

catalog:
  "@adamaho/nopeus-oxfmt-config": 0.3.0
  "@adamaho/nopeus-oxlint-config": 0.7.0
  "@adamaho/nopeus-oxlint-plugin": 0.12.0
  "@adamaho/nopeus-tsconfig": 0.3.2
  "@changesets/cli": 3.0.3
  "@effect/tsgo": 0.67.5
  "@effect/vitest": 4.1.2
  "@types/node": 26.6.6
  effect: 4.1.2
  oxfmt: 0.77.0
  oxlint: 1.92.0
  rimraf: 6.1.4
  turbo: 2.11.10
  typescript: 7.0.2
  vitest: 5.1.0

catalogMode: strict

saveExact: true
engineStrict: true

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - "@adamaho/*"
