packages:
  - programs/*
  - packages/*
  - tools/*
  - infra/*

allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true

catalog:
  "@adamaho/nopeus-oxfmt-config": 0.1.0
  "@adamaho/nopeus-oxlint-config": 0.5.0
  "@adamaho/nopeus-oxlint-plugin": 0.9.0
  "@adamaho/nopeus-tsconfig": 0.3.2
  "@changesets/cli": 3.0.2
  "@effect/tsgo": 0.47.2
  "@effect/vitest": 4.0.0
  "@types/node": 24.13.3
  effect: 4.0.0
  oxfmt: 0.71.0
  oxlint: 1.81.0
  rimraf: 6.1.3
  turbo: 2.10.12
  typescript: 7.0.2
  vitest: 5.0.3

catalogMode: strict

saveExact: true
engineStrict: true

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - "@adamaho/nopeus-oxfmt-config"
  - "@adamaho/nopeus-oxlint-config"
  - "@adamaho/nopeus-oxlint-plugin"
  - "@adamaho/nopeus-tsconfig"
