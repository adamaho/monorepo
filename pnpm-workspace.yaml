packages:
  - programs/*
  - packages/*
  - tools/*
  - infra/*

allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true

catalog:
  "@adamaho/nopeus-oxlint-config": 0.2.0
  "@adamaho/nopeus-oxlint-plugin": 0.2.0
  "@changesets/cli": 3.0.1
  "@effect/tsgo": 0.41.0
  "@effect/vitest": 4.0.0-rc.112
  "@types/node": 24.13.3
  effect: 4.0.0-rc.112
  oxfmt: 0.64.0
  oxlint: 1.79.0
  rimraf: 6.1.3
  turbo: 2.10.11
  typescript: 7.0.2
  vitest: 4.1.11

catalogMode: strict

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - "@adamaho/nopeus-oxlint-config"
  - "@adamaho/nopeus-oxlint-plugin"
